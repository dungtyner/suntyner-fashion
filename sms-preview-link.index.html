<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Basic -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tap to view the image" />

  <!-- ===== Open Graph (CRITICAL for iOS / iMessage / SMS) ===== -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Image" />
  <meta property="og:description" content="Tap to view the image" />
  <meta property="og:url" content="https://tom-fashion.vercel.app/share/image" />
  <link rel="canonical" href="https://tom-fashion.vercel.app/share/image" />

  <meta
    property="og:image"
    content="https://www.apple.com/v/iphone/home/t/images/home/og.png?201610171354"
  />
  <meta
    property="og:image:secure_url"
    content="https://www.apple.com/v/iphone/home/t/images/home/og.png?201610171354"
  />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ===== Twitter / iMessage fallback ===== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Image" />
  <meta name="twitter:description" content="Tap to view the image" />
  <meta
    name="twitter:image"
    content="https://www.apple.com/v/iphone/home/t/images/home/og.png?201610171354"
  />

  <!-- Minimal style -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <!-- iOS hidden text nodes (important for preview reliability) -->
  <h1 style="display:none">Image</h1>
  <p style="display:none">Tap to view the image</p>

  <!-- Visible image -->
  <img
    src="https://www.apple.com/v/iphone/home/t/images/home/og.png?201610171354"
    alt="Image"
  />
</body>
</html>
