  <meta property="og:type" content="website" />
<meta property="og:title" content="Image" />
<meta property="og:description" content="Tap to view the image" />
<meta property="og:url" content="https://tom-fashion.vercel.app/share/image" />
<link rel="canonical" href="https://tom-fashion.vercel.app/share/image" />

<meta property="og:image" content="https://tom-fashion.vercel.app/logo-min.jpeg" />
<meta property="og:image:secure_url" content="https://tom-fashion.vercel.app/logo-min.jpeg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Image" />
<meta name="twitter:description" content="Tap to view the image" />
<meta name="twitter:image" content="https://tom-fashion.vercel.app/logo-min.jpeg" />

  <!-- Minimal style -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>

<body>
  <!-- 
    ⚠️ iOS REQUIREMENT:
    Hidden text nodes to force rich preview rendering
  -->
  <h1 style="display:none">Image</h1>
  <p style="display:none">Tap to view the image</p>

  <!-- Visible image -->
  <img
    src="https://tom-fashion.vercel.app/logo-min.jpeg"
    alt="Image"
  />
</body>
</html>
