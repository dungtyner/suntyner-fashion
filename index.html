<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Image</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Image" />
  <meta property="og:description" content="Tap to view the image" />
  <meta
    property="og:image"
    content="https://tom-fashion.vercel.app/logo-min.jpeg"
  />

  <!-- Twitter / SMS / Chat fallback -->
  <meta name="twitter:title" content="Image" />
  <meta name="twitter:description" content="Tap to view the image" />
  <meta
    name="twitter:image"
    content="https://tom-fashion.vercel.app/logo-min.jpeg"
  />
</head>

<body style="margin:0; background:#000;">
  <img
    src="https://tom-fashion.vercel.app/logo-min.jpeg"
    alt="img"
    style="width:100%; height:auto; display:block;"
  />
</body>

</html>
